<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('operations-client-display-preferences'));
        document.documentElement.dataset.theme = saved?.state?.theme === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="React Operations Client portfolio project" />
    <title>Operations Client</title>
  </head>
  <body>
    <div id="root">
      <div
        style="min-height: 100vh; display: grid; place-items: center"
        role="status"
        aria-label="Loading application"
      >
        <progress aria-label="Loading application"></progress>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
